name: health_messenger_ui
description: Messenger-like reusable chat UI package for Flutter.
version: 0.1.0
homepage: https://example.com

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  audioplayers: ^6.5.1
  http: ^1.2.2
  dio: ^5.9.0
  socket_io_client: ^3.1.2
  file_selector: ^1.0.3
  image_picker: ^1.2.0
  record: ^6.2.0
  app_settings: ^5.1.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  pdfx: ^2.8.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.example.health_messenger_ui
        pluginClass: HealthMessengerUiPlugin
      ios:
        pluginClass: HealthMessengerUiPlugin
